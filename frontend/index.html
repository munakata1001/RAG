<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文書管理システム (RAG PoC)</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 1em; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        button { cursor: pointer; }
        .delete-btn { color: #fff; background-color: #dc3545; border: none; padding: 5px 10px; border-radius: 4px; }
        .upload-form { margin-top: 2em; padding: 1em; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>文書管理</h1>

    <h2>登録済み文書一覧</h2>
    <table id="documents-table">
        <thead>
            <tr>
                <th>ファイル名</th>
                <th>ファイル形式</th>
                <th>更新日</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <!-- データはJavaScriptで動的に挿入されます -->
        </tbody>
    </table>

    <div class="upload-form">
        <h2>新規文書アップロード</h2>
        <input type="file" id="file-input">
        <button id="upload-btn">アップロード</button>
        <p id="upload-status"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
